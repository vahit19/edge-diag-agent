# Builds the offline container and answers one question inside it with networking disabled.
# The image is not pushed anywhere: it contains the Siemens manuals, which are not redistributed.
name: container
on:
  push:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.4.2 numpy==2.5.4 rank-bm25==0.2.2
      - run: python -m pytest -q tests

  image:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space for two GGUF models and the build
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - name: Build (1.5B model)
        run: docker build --build-arg MODEL=qwen2.5-1.5b-instruct-q4_k_m.gguf -t edge-diag-agent:ci .
      - name: Image size
        run: docker image ls edge-diag-agent:ci
      - name: Answer a question with no network
        run: |
          docker run --rm --network none --memory 3g edge-diag-agent:ci \
            python -m diag.agent "G120C shows F7900 when the conveyor starts in automatic mode" --threads 2 | tee answer.txt
          grep -q "F07900" answer.txt
          grep -q "acknowledge" answer.txt
